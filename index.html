<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abeer Tech OS Pro</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        header { border-bottom: 2px solid #00ffcc; padding-bottom: 20px; }
        h1 { color: #ffffff; }
        h1 span { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        .card { background-color: #121212; border: 1px solid #00ffcc; border-radius: 12px; padding: 20px; margin: 20px auto; max-width: 400px; }
        .btn { background-color: #00ffcc; color: #000; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
        input { width: 90%; padding: 10px; background-color: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 6px; margin: 10px 0; }
        .result-box { background-color: #1a1a1a; padding: 12px; border-radius: 6px; margin-top: 15px; border: 1px dashed #444; }
        #qrcode img { margin: 10px auto; }
    </style>
</head>
<body>
    <header>
        <div style="background:#00ffcc; color:#000; display:inline-block; padding:5px 10px; font-weight:bold; border-radius:20px;">MADE BY ABEER</div>
        <h1>Welcome to <span>Abeer Tech OS Pro</span></h1>
        <p>Premium Android ISOs & Tools for Laptops (Tested on Dell Latitude E5540)</p>
    </header>
    <div class="card">
        <h3>Bliss OS 14 (Android 11)</h3>
        <p>Best for Dell Latitude E5540. Smooth UI & Gaming.</p>
        <button class="btn" onclick="alert('ISO Link Coming Soon!')">Download ISO</button>
    </div>
    <div class="card">
        <h3>Password Generator</h3>
        <button class="btn" onclick="generatePassword()">Generate Secure Password</button>
        <div class="result-box" id="passResult">Click button above...</div>
    </div>
    <div class="card">
        <h3>QR Code Generator</h3>
        <input type="text" id="qrText" placeholder="Paste link or text here...">
        <button class="btn" onclick="makeQR()">Create QR Code</button>
        <div id="qrcode"></div>
    </div>
    <script>
        function generatePassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$";
            let pass = "";
            for (let i = 0; i < 10; i++) { pass += chars.charAt(Math.floor(Math.random() * chars.length)); }
            document.getElementById("passResult").innerText = pass;
        }
        function makeQR() {
            let text = document.getElementById("qrText").value;
            if(!text) { alert("Pehle kuch likhein!"); return; }
            document.getElementById("qrcode").innerHTML = ""; 
            new QRCode(document.getElementById("qrcode"), { text: text, width: 128, height: 128 });
        }
    </script>
</body>
</html>
